name: AI Article Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'src/app/blog/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    uses: cybrixcc/leadhunter-engine/.github/workflows/ai-article-review.yml@master
    with:
      config_path: ./config.yml
    secrets: inherit
