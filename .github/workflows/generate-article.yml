name: Generate Blog Article

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily — adjust as needed
  workflow_dispatch:
    inputs:
      topic_number:
        description: 'Specific topic number (optional)'
        required: false
        type: number
      dry_run:
        description: 'Dry run (no commit/PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    uses: cybrixcc/leadhunter-engine/.github/workflows/generate-article.yml@master
    with:
      config_path: ./config.yml
      topic_number: ${{ inputs.topic_number }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
